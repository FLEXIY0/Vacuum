# Vacuum — memory tuning to match the zram setup.

# Swapping to compressed RAM is cheap, so let the kernel do it eagerly
# instead of dropping page cache. Meaningless without zram; harmless with it.
vm.swappiness = 100

# zram has no seek penalty, so read a single page at a time rather than
# faulting in a whole 8-page cluster that will mostly go unused.
vm.page-cluster = 0

# Keep dentry/inode caches around a little longer than the default; on a
# small-RAM machine they are what make the file manager feel instant.
vm.vfs_cache_pressure = 50

# Writeback earlier and in smaller batches: less chance of a multi-hundred-
# megabyte dirty set on a machine that only has a few hundred to begin with.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
