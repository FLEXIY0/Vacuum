-- Vacuum — the side HUD: what the machine is doing, and which key does what.
--
-- Toggled with Super+F1 (see vacuum-hud). Update interval is 2s rather than
-- the usual 1s: this is meant to run on machines where a wasted wakeup
-- costs something, and nothing here changes fast enough to notice.

conky.config = {
    alignment = 'top_right',
    gap_x = 14,
    gap_y = 40,               -- clears the 26px panel
    minimum_width = 250,
    maximum_width = 250,

    update_interval = 2.0,
    total_run_times = 0,
    -- No back buffer: with a solid window colour conky clears each frame
    -- itself, so double buffering buys nothing here and costs a buffer plus
    -- a DBE dependency -- and where DBE is present it hides the text from
    -- anything that screenshots the root window.
    double_buffer = false,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    own_window = true,
    -- 'override' rather than 'desktop' or 'normal': those two rendered an
    -- empty window under a plain X server here, and override is the variant
    -- conky users fall back to for exactly that reason. The window is
    -- unmanaged, so the WM neither decorates it nor lists it.
    own_window_type = 'override',
    -- Solid, not transparent. Pseudo-transparency leaves conky unable to
    -- erase the previous frame wherever double buffering is unavailable,
    -- and the result is every changing number drawn on top of the last one.
    -- The colour is the palette background, so against the wallpaper this
    -- still reads as part of the desktop rather than as a box.
    own_window_transparent = false,
    own_window_colour = '0b0c0e',
    own_window_argb_visual = false,
    own_window_class = 'Conky',
    own_window_title = 'vacuum-hud',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=8',
    xftalpha = 1.0,
    override_utf8_locale = true,

    default_color = 'd2d6dc',
    color1 = '6b7280',        -- labels and dim text
    color2 = '5fb8c7',        -- the accent, used sparingly
    color3 = 'd4796a',        -- only when something is wrong

    border_inner_margin = 0,
    border_outer_margin = 0,
    short_units = true,
    pad_percents = 2,
    top_name_width = 10,
}

conky.text = [[
${color2}VACUUM${color1}  ${execi 3600 . /etc/vacuum-release 2>/dev/null; echo $VERSION}${color}
${color1}${hr 1}${color}
${color1}cpu ${color}${cpu}%${alignr}${color1}${freq_g}GHz${color}
${cpubar 3,250}
${color1}load${color} ${loadavg 1} ${loadavg 2} ${loadavg 3}${alignr}${color1}${uptime_short}${color}

${color1}ram ${color}${mem}${alignr}${color1}of ${memmax}${color}
${membar 3,250}
${color1}zram${color} ${execi 5 vacuum-stat zram}
${color1}disk${color} ${fs_used /}${alignr}${color1}of ${fs_size /}${color}
${fs_bar 3,250 /}

${color1}net ${color}${execi 3 vacuum-stat link}
${color1}    ${color}${execi 3 vacuum-stat net}
${if_existing /sys/class/power_supply/BAT0}${color1}bat ${color}${battery_percent BAT0}%${alignr}${color1}${battery_time BAT0}${color}
${battery_bar 3,250 BAT0}
${endif}
${color1}${hr 1}${color}
${color1}top by memory${color}
${top_mem name 1}${alignr}${top_mem mem_res 1}
${top_mem name 2}${alignr}${top_mem mem_res 2}
${top_mem name 3}${alignr}${top_mem mem_res 3}

${color1}${hr 1}${color}
${color1}keys${color}
${color1}${execi 300 vacuum-keys --pad 15}${color}
]]
