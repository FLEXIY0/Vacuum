[Settings]
# Vacuum ships no GTK theme package: Adwaita's built-in dark variant comes
# with gtk+3 itself, so pcmanfm matches the rest of the desktop for free.
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-font-name=DejaVu Sans 9
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-menu-images=0
gtk-button-images=0
gtk-enable-animations=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
