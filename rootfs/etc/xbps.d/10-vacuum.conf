# Vacuum — xbps policy.
#
# Nothing here changes which packages you get; it only keeps an installed
# system from growing back weight the image was built without. Delete a line
# to opt back in, then reinstall the affected package.

# Translated manpages. English pages, and all locale data, are kept: locales
# cost disk but not memory, and dropping them breaks UI translations.
noextract=/usr/share/man/??/*
noextract=/usr/share/man/??_*/*
